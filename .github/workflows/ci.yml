name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run pytest
        env:
          SPEECH_PROVIDER: mock
        run: pytest -q

  frontend:
    name: Frontend type-check & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Type-check shared
        run: npx tsc --noEmit -p shared/tsconfig.json
      - name: Type-check dashboard
        run: npx tsc --noEmit -p dashboard/tsconfig.json
      - name: Type-check mobile
        run: npx tsc --noEmit -p mobile/tsconfig.json
      - name: Build dashboard and mobile
        run: npm run build
